<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Josefin+Sans:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <title>Life Below Water</title>

    <style>
        body {
            background-image: url('background.jpg');
            background-size: cover;
            background-position: center;
            background-repeat: no-repeat;
            height: 100vh;
            margin: 0;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .text-box {
            width: 50%;
            height: auto;
            border: 2px;
            background-color: rgba(0, 0, 10, 0.6);
            color: white;
            padding: 20px;
            display: inline-block;
            border-radius: 10px;
            font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, 'Open Sans', 'Helvetica Neue', sans-serif;
        }

        .center-container {
            display: grid;
            place-items: center;
        }

        .topic-container {
            display: flex;
            align-items: center;
            gap: 5px;
            flex-wrap: wrap;
        }

        .water-drop {
            height: 50px;
            max-width: 500px;
            display: block;
        }

        .ripple-loader {
            width: 30px;
            height: 30px;
            border: 4px solid #3498db;
            border-radius: 50%;
            animation: ripple 1s infinite ease-in-out;
            margin: 100px auto;
        }

        @keyframes ripple {
            0% {
                transform: scale(0.8);
                opacity: 1;
            }
            100% {
                transform: scale(2.5);
                opacity: 0;
            }
        }

        .group-names {
            text-align: center;
            font-family: poppins;
        }
    </style>
</head>
<body>
    <div class="text-box">
        <div class="center-container">
            <div class="topic-container">
                <h1 style="font-family: Josefin Sans; font-size: 30px;">Life Below Water</h1>
                <img src="water drop.png" alt="A small drop of water describing the topic." class="water-drop">
            </div>
        </div>
        <h4 style="text-align: center; font-weight: 400;">"Raising awareness to protect marine life and oceans."</h4>
        <div class="ripple-loader"></div>
        <div class="group-names">
            <p>Group Members</p>
            <p>-----------------------</p>
            <p>
                <ul>
                    <li>B.M.T.U. Induwara Bandara</li>
                    <li>B.D.C.B. Steferd</li>
                    <li>S.M. Maleesha Ruwandi Bandaranayake</li>
                    <li>H.K.D. Mayumi Bhagya</li>
                </ul>
            </p>
        </div>
    </div>
</body>
</html>
