<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Life Below Water - Feedback</title>
  <link rel="stylesheet" href="global.css">
  <style>
        body {
            margin: 0;
            font-family: 'Segoe UI', sans-serif;
            background-image: url('https://images.unsplash.com/photo-1507525428034-b723cf961d3e'); /* Ocean image */
            background-size: cover;
            background-position: center;
            background-attachment: fixed;
            color: #fff;
        }

        .overlay {
            background-color: rgba(0, 0, 50, 0.7);
            min-height: 100vh;
            padding: 50px 20px;
            display: flex;
            justify-content: center;
            align-items: center;
            backdrop-filter: blur(5px);
        }

        form {
            background: rgba(255, 255, 255, 0.95);
            padding: 30px;
            border-radius: 15px;
            max-width: 800px;
            width: 100%;
            color: #333;
            box-shadow: 0 8px 20px rgba(0, 0, 0, 0.4);
        }

        h2 {
            text-align: center;
            color: #ffffff;
            text-shadow: 1px 1px 4px #000;
        }

        fieldset {
            border: none;
            margin-bottom: 25px;
        }

        legend {
            font-weight: bold;
            font-size: 1.2em;
            margin-bottom: 10px;
            color: #006064;
        }

        label {
            display: block;
            margin-top: 12px;
            font-weight: 600;
        }

        input, select, textarea {
            width: 100%;
            padding: 10px;
            margin-top: 5px;
            border: 1px solid #aaa;
            border-radius: 6px;
            font-size: 1em;
            background: #f9f9f9;
        }

        input[type="radio"],
        input[type="checkbox"] {
            width: auto;
            margin-right: 5px;
        }

        .rating span {
            font-size: 28px;
            cursor: pointer;
            transition: transform 0.2s ease;
            display: inline-block;
        }

        .rating span:hover {
            color: gold;
            transform: scale(1.3);
        }

        .submit-btn {
            background: #00796b;
            color: white;
            padding: 12px 20px;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            font-size: 1em;
            margin-top: 20px;
            transition: background 0.3s ease;
        }

        .submit-btn:hover {
            background: #004d40;
        }

        .char-count {
            font-size: 0.9em;
            color: #555;
        }

        footer {
            text-align: center;
            margin-top: 40px;
            color: #eee;
        }

        footer a {
            color: #ffffff;
            text-decoration: underline;
        }
  </style>
</head>
<body>
  <h2>Feedback Form - Life Below Water</h2>
  <div class="overlay">
    <form>
      <fieldset>
        <legend>Personal Details</legend>

        <label for="name">Full Name:</label>
        <input type="text" id="name" name="name" required maxlength="50" title="Please enter your full name">

        <label for="email">Email Address:</label>
        <input type="email" id="email" name="email" required title="Please enter a valid email address">

        <label for="phone">Telephone Number:</label>
        <input type="tel" id="phone" name="phone" pattern="[0-9]{10}" required title="Enter a 10-digit phone number">

        <label for="address">Address:</label>
        <textarea id="address" name="address" rows="3" maxlength="150" required title="Please enter your address"></textarea>
      </fieldset>

      <fieldset>
        <legend>Feedback Details</legend>

        <label for="topic">Select a Topic:</label>
        <select id="topic" name="topic">
          <option>Marine Pollution</option>
          <option>Endangered Species</option>
          <option>Coral Reefs</option>
          <option>Sustainable Fishing</option>
          <option>Ocean Protection</option>
        </select>

        <label for="interest">Interested Areas:</label>
        <select id="interest" name="interest" multiple size="4">
          <option>Clean-up campaigns</option>
          <option>Conservation projects</option>
          <option>Marine research</option>
          <option>Volunteering</option>
        </select>

        <label for="datalistInput">How did you hear about us?</label>
        <input list="sources" id="datalistInput" name="source">
        <datalist id="sources">
          <option value="Social Media">
          <option value="News">
          <option value="Friends">
          <option value="School Project">
        </datalist>

        <label>Would you recommend our website?</label>
        <input type="radio" name="recommend" value="yes"> Yes
        <input type="radio" name="recommend" value="no"> No

        <label>What did you find useful?</label>
        <input type="checkbox" name="useful" value="Design"> Design
        <input type="checkbox" name="useful" value="Content"> Content
        <input type="checkbox" name="useful" value="Resources"> Resources

        <label for="comment">Your Comments:</label>
        <textarea id="comment" name="comment" rows="4" maxlength="200" required
                  oninput="document.getElementById('count').textContent = 200 - this.value.length"
                  title="Max 200 characters."></textarea>
        <p class="char-count">Characters remaining: <span id="count">200</span></p>

        <label for="date">Date:</label>
        <input type="date" id="date" name="date">

        <label for="datetime">Preferred Feedback Time:</label>
        <input type="datetime-local" id="datetime" name="datetime">

        <label for="upload">Upload Attachment (Image or PDF):</label>
        <input type="file" id="upload" name="upload" accept=".jpg,.png,.pdf">

        <label>Rate Us:</label>
    <div class="rating">
        <span title="Very Happy">😁</span>
        <span title="Happy">😊</span>
        <span title="Neutral">😐</span>
        <span title="Unhappy">☹️</span>
        <span title="Very Unhappy">😠</span>
    </div>

      </fieldset>

      <button class="submit-btn" type="submit">Submit Feedback</button>
    </form>
  </div>

  <footer>
    <p><a href="editor-student3.html">Go to Student 3's Editor Page</a></p>
  </footer>
</body>
</html>
